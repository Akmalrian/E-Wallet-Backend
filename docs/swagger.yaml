basePath: /
definitions:
  dto.CheckPinBody:
    properties:
      pin:
        type: string
    required:
    - pin
    type: object
  dto.DashboardResponse:
    properties:
      balance:
        type: number
      total_expense:
        type: number
      total_income:
        type: number
    type: object
  dto.GetProfileResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      fullname:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      photo_path:
        type: string
    type: object
  dto.GraphFilter:
    properties:
      end_date:
        description: '"2024-01-31"'
        type: string
      start_date:
        description: '"2024-01-01"'
        type: string
      type:
        description: '"income", "expense", "both"'
        type: string
    type: object
  dto.GraphPoint:
    properties:
      expense:
        description: ← total transfer
        type: number
      income:
        description: ← total topup
        type: number
      label:
        description: ← label sumbu X (tanggal/bulan)
        type: string
    type: object
  dto.GraphResponse:
    properties:
      filter:
        $ref: '#/definitions/dto.GraphFilter'
      points:
        items:
          $ref: '#/definitions/dto.GraphPoint'
        type: array
    type: object
  dto.HistoryListResponse:
    properties:
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
      transactions:
        items:
          $ref: '#/definitions/dto.HistoryResponse'
        type: array
    type: object
  dto.HistoryResponse:
    properties:
      amount:
        type: number
      created_at:
        type: string
      id:
        type: integer
      notes:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  dto.LoginBody:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.PaginationMeta:
    properties:
      current_page:
        type: integer
      limit:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.ReceiverListResponse:
    properties:
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
      receivers:
        items:
          $ref: '#/definitions/dto.ReceiverResponse'
        type: array
    type: object
  dto.ReceiverResponse:
    properties:
      email:
        type: string
      fullname:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      photo_path:
        type: string
      wallet_id:
        type: integer
    type: object
  dto.RegisterBody:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.SwaggerDashboardResponse:
    properties:
      data:
        $ref: '#/definitions/dto.DashboardResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerGraphResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GraphResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerHistoryResponse:
    properties:
      data:
        $ref: '#/definitions/dto.HistoryListResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerLoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.LoginResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerProfileResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetProfileResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerReceiversResponse:
    properties:
      data:
        $ref: '#/definitions/dto.ReceiverListResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerTopupResponse:
    properties:
      data:
        $ref: '#/definitions/dto.TopupResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.SwaggerTransferResponse:
    properties:
      data:
        $ref: '#/definitions/dto.TransferResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.TopupBody:
    properties:
      order_amount:
        type: number
      payment_method_id:
        type: integer
    required:
    - order_amount
    - payment_method_id
    type: object
  dto.TopupResponse:
    properties:
      created_at:
        type: string
      order_amount:
        type: number
      payment_method:
        type: string
      status:
        type: string
      tax_amount:
        type: number
      total_amount:
        type: number
      transaction_id:
        type: integer
    type: object
  dto.TransferBody:
    properties:
      amount:
        type: number
      notes:
        type: string
      pin:
        type: string
      receiver_wallet_id:
        type: integer
    required:
    - amount
    - pin
    - receiver_wallet_id
    type: object
  dto.TransferResponse:
    properties:
      amount:
        type: number
      created_at:
        type: string
      notes:
        type: string
      receiver_wallet_id:
        type: integer
      status:
        type: string
      transaction_id:
        type: integer
    type: object
  dto.UpdatePasswordBody:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.UpdatePinBody:
    properties:
      new_pin:
        type: string
      old_pin:
        type: string
    required:
    - new_pin
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      fullname:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      photo_path:
        type: string
    type: object
  pkg.BaseResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  pkg.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:9000
info:
  contact: {}
  description: Backend created by Koda using Gin
  license:
    name: MIT
  title: Backend E-WALLET
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password, mendapatkan JWT token
      parameters:
      - description: Login Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil
          schema:
            $ref: '#/definitions/dto.SwaggerLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    delete:
      description: Logout dan hapus token dari whitelist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun user baru dan wallet dengan saldo 0
      parameters:
      - description: Register Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Register user baru
      tags:
      - Auth
  /transactions/history:
    get:
      description: Mengambil riwayat transaksi user dengan filter dan pagination
      parameters:
      - description: 'Filter tipe: topup / transfer'
        in: query
        name: type
        type: string
      - description: 'Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SwaggerHistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: History transaksi
      tags:
      - Transactions
  /transactions/topup:
    post:
      consumes:
      - application/json
      description: Menambah saldo wallet user
      parameters:
      - description: Topup Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.TopupBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SwaggerTopupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Top up saldo
      tags:
      - Transactions
  /transactions/transfer:
    post:
      consumes:
      - application/json
      description: Transfer saldo ke user lain dengan verifikasi PIN
      parameters:
      - description: Transfer Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.TransferBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SwaggerTransferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Transfer saldo
      tags:
      - Transactions
  /users/dashboard:
    get:
      description: Mengambil informasi dashboard (balance, total income, total expense)
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil
          schema:
            $ref: '#/definitions/dto.SwaggerDashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard info
      tags:
      - Dashboard
  /users/dashboard/graph:
    get:
      description: Mengambil data graph transaksi dengan filter type dan date range
      parameters:
      - description: 'Filter: income / expense / both (default: both)'
        in: query
        name: type
        type: string
      - description: 'Tanggal mulai format: 2024-01-01 (default: 7 hari lalu)'
        in: query
        name: start_date
        type: string
      - description: 'Tanggal akhir format: 2024-01-31 (default: hari ini)'
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SwaggerGraphResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard graph
      tags:
      - Dashboard
  /users/password:
    patch:
      consumes:
      - application/json
      description: Memverifikasi Password user lama sebelum mengganti password baru
      parameters:
      - description: Update Password Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePasswordBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update password user
      tags:
      - Users
  /users/pin:
    patch:
      consumes:
      - application/json
      description: Mengubah PIN lama dengan varifikasi PIN yang baru
      parameters:
      - description: Update PIN Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePinBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update PIN user
      tags:
      - Users
  /users/pin/check:
    post:
      consumes:
      - application/json
      description: Memverifikasi PIN user sebelum melakukan transaksi
      parameters:
      - description: Check PIN Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CheckPinBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check PIN user
      tags:
      - Users
  /users/profile:
    get:
      description: Mengambil data profile user yang sedang login
      produces:
      - application/json
      responses:
        "200":
          description: Profile berhasil diambil
          schema:
            $ref: '#/definitions/dto.SwaggerProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get profile user
      tags:
      - Users
    patch:
      consumes:
      - multipart/form-data
      description: Update profile dengan atau tanpa upload foto
      parameters:
      - description: Nama lengkap
        in: formData
        name: fullname
        type: string
      - description: Nomor telepon
        in: formData
        name: phone_number
        type: string
      - description: Foto profile (opsional)
        in: formData
        name: photo
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profile user
      tags:
      - Users
  /users/receiver:
    get:
      description: Mencari user lain sebagai penerima transfer dengan search dan pagination
      parameters:
      - description: Cari berdasarkan nama/email/phone
        in: query
        name: search
        type: string
      - description: 'Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 7)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil
          schema:
            $ref: '#/definitions/dto.SwaggerReceiversResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cari penerima transfer
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
